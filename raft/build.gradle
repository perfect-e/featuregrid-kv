// raft/build.gradle — Raft consensus module
// Contains: RaftNode state machine, RaftLog, GrpcRaftTransport, RaftServiceGrpcImpl
// Proto stubs (RaftService, RequestVote, AppendEntries) are generated in :proto
// and available here via implementation project(':proto').

dependencies {
    implementation project(':proto')

    // gRPC client channel + Netty transport (for GrpcRaftTransport outgoing calls)
    // grpc-protobuf and grpc-stub provide ByteString, StreamObserver, stub base classes
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    compileOnly    "javax.annotation:javax.annotation-api:1.3.2"

    // Jackson for RaftCommand JSON serialization
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.13'
    runtimeOnly    'ch.qos.logback:logback-classic:1.5.6'

    // Testing
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"
    testImplementation "org.assertj:assertj-core:3.26.0"
    testRuntimeOnly    "org.junit.platform:junit-platform-launcher"
}
